
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Freedom Finance</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}
.login-box{
  width:100%;
  max-width:400px;
  padding:30px 24px;
  background:#151515;
  border:1px solid #b88a32;
  border-radius:14px;
  box-shadow:0 0 25px #b88a3220;
}
h2{
  color:#d8ad52;
  text-align:center;
  margin:0 0 8px;
}
.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:28px;
  font-size:14px;
}
label{
  display:block;
  margin:15px 0 7px;
  color:#d8ad52;
  font-size:14px;
}
input{
  width:100%;
  padding:13px;
  background:#080808;
  color:white;
  border:1px solid #555;
  border-radius:7px;
  outline:none;
}
input:focus{border-color:#d8ad52}
button{
  width:100%;
  margin-top:24px;
  padding:14px;
  background:linear-gradient(90deg,#a87920,#f0ce72);
  color:#111;
  font-weight:bold;
  border:0;
  border-radius:7px;
  cursor:pointer;
  font-size:16px;
}
button:disabled{opacity:.6;cursor:not-allowed}
#message{
  margin-top:18px;
  text-align:center;
  font-size:14px;
  line-height:1.5;
  overflow-wrap:anywhere;
}
.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#d8ad52;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>
<div class="login-box">
  <h2>FREEDOM FINANCE</h2>
  <div class="subtitle">Secure Admin Login</div>

  <form id="adminForm">
    <label for="email">Admin Email</label>
    <input id="email" type="email" autocomplete="username"
      placeholder="Enter admin email" required>

    <label for="password">Password</label>
    <input id="password" type="password"
      autocomplete="current-password"
      placeholder="Enter password" required>

    <button id="loginBtn" type="submit">ADMIN LOGIN</button>
  </form>

  <div id="message" role="status"></div>
  <a class="back" href="index.html">Back to Website</a>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBcmNDQz0BjeX0d1Zx5LJyUZmGofu_wRHA",
  authDomain: "omvardhnaayefreedomfinan-efaf4.firebaseapp.com",
  projectId: "omvardhnaayefreedomfinan-efaf4",
  storageBucket: "omvardhnaayefreedomfinan-efaf4.firebasestorage.app",
  messagingSenderId: "552483514216",
  appId: "1:552483514216:web:3f6bfa2c10e74a97ba18dd",
  measurementId: "G-6MPELL55BD"
};

const ADMIN_UID = "oQ14ElwzwMTQacne1dTIZ5DX9bQ2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById("adminForm");
const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");

let checking = true;

onAuthStateChanged(auth, async (user) => {
  if (!checking) return;
  checking = false;

  if (!user) return;

  if (user.uid === ADMIN_UID) {
    window.location.replace("admin-dashboard.html");
  } else {
    await signOut(auth);
    message.textContent = "Admin access denied. Please use the authorized admin account.";
    message.style.color = "#ff7777";
  }
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true;
  loginBtn.textContent = "PLEASE WAIT...";
  message.textContent = "";

  try {
    const result = await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    if (result.user.uid !== ADMIN_UID) {
      await signOut(auth);
      throw new Error("This account is not authorized as Admin.");
    }

    message.style.color = "#8ee69b";
    message.textContent = "Login successful. Opening Admin Dashboard...";

    window.location.replace("admin-dashboard.html");

  } catch (error) {
    message.style.color = "#ff7777";

    const errors = {
      "auth/invalid-credential": "Incorrect admin email or password.",
      "auth/user-not-found": "Admin account not found.",
      "auth/wrong-password": "Incorrect password.",
      "auth/too-many-requests": "Too many attempts. Try again later.",
      "auth/network-request-failed": "Network error. Check your internet."
    };

    message.textContent =
      errors[error.code] || error.message || "Admin login failed.";

    loginBtn.disabled = false;
    loginBtn.textContent = "ADMIN LOGIN";
  }
});
</script>
</body>
</html>
