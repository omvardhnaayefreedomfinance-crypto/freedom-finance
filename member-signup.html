<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Freedom Finance</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .signup-card {
      max-width: 500px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }

    .terms-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .terms-group input {
      width: auto;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .signup-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <section class="community">

    <div class="section-number">COMMUNITY</div>

    <h2>Create Your <span>Account</span></h2>

    <p class="community-text">
      Join the Freedom Finance community and create your member account.
    </p>

    <div class="signup-card">

      <form id="signupForm">

        <!-- FULL NAME -->
        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <!-- EMAIL -->
        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <!-- MOBILE -->
        <div class="form-group">
          <label for="mobile">Mobile Number</label>

          <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            required
          >
        </div>

        <!-- PASSWORD -->
        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            placeholder="Create password"
            required
          >
        </div>

        <!-- CONFIRM PASSWORD -->
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            required
          >
        </div>

        <!-- TERMS -->
        <div class="terms-group">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the Terms & Conditions
          </label>

        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="signup-btn"
        >
          CREATE ACCOUNT
        </button>

        <!-- MESSAGE -->
        <div
          id="signupMessage"
          class="signup-message"
        ></div>

      </form>

      <p class="login-text">
        Already have an account?
        <a href="member-login.html">Member Login</a>
      </p>

      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Home
      </a>

    </div>

  </section>


  <script>

    document
      .getElementById("signupForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        /* =========================
           GET FORM DATA
        ========================= */

        const name =
          document
            .getElementById("fullName")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();

        const mobile =
          document
            .getElementById("mobile")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value;

        const message =
          document.getElementById("signupMessage");


        /* =========================
           PASSWORD CHECK
        ========================= */

        if (password !== confirmPassword) {

          message.textContent =
            "Passwords do not match.";

          message.style.color = "red";

          return;
        }


        /* =========================
           GET EXISTING MEMBERS
        ========================= */

        let members = [];

        try {

          members =
            JSON.parse(
              localStorage.getItem("members")
            ) || [];

        } catch (error) {

          members = [];

        }


        /* =========================
           DUPLICATE EMAIL CHECK
        ========================= */

        const existingMember =
          members.find(function(member) {

            return (
              member.email &&
              member.email.toLowerCase() === email
            );

          });


        if (existingMember) {

          message.textContent =
            "This email is already registered.";

          message.style.color = "red";

          return;
        }


        /* =========================
           GENERATE MEMBER ID
        ========================= */

        const memberNumber =
          String(members.length + 1)
            .padStart(5, "0");

        const memberId =
          "FF" + memberNumber;


        /* =========================
           REFERRAL ID
        ========================= */

        const myReferralId =
          "REF" +
          Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


        /* =========================
           DATE
        ========================= */

        const now =
          new Date();

        const createdAt =
          now.toISOString();

        const joinDate =
          now.toLocaleDateString();


        /* =========================
           CREATE MEMBER OBJECT
        ========================= */

        const newMember = {

          id: Date.now(),

          memberId: memberId,

          name: name,

          email: email,

          mobile: mobile,

          password: password,

          referralId: "",

          referredBy: "",

          myReferralId: myReferralId,

          status: "Active",

          investment: 0,

          totalInvestment: 0,

          profit: 0,

          availableBalance: 0,

          totalWithdrawal: 0,

          plan: "",

          planName: "",

          createdAt: createdAt,

          joinDate: joinDate

        };


        /* =========================
           SAVE MEMBER
        ========================= */

        members.push(newMember);

        localStorage.setItem(
          "members",
          JSON.stringify(members)
        );


        /* =========================
           OLD LOGIN COMPATIBILITY
        ========================= */

        const oldUser = {

          name: name,

          email: email,

          mobile: mobile,

          password: password,

          memberId: memberId,

          myReferralId: myReferralId

        };

        localStorage.setItem(
          "ffdemo",
          JSON.stringify(oldUser)
        );


        /* =========================
           CURRENT MEMBER
        ========================= */

        localStorage.setItem(
          "currentMember",
          JSON.stringify(newMember)
        );

        localStorage.setItem(
          "memberEmail",
          email
        );

        localStorage.setItem(
          "memberLoggedIn",
          "true"
        );


        /* =========================
           BALANCE INITIALIZATION
        ========================= */

        if (
          !localStorage.getItem(
            "availableBalance"
          )
        ) {

          localStorage.setItem(
            "availableBalance",
            "0"
          );

        }


        /* =========================
           TRANSACTIONS INITIALIZATION
        ========================= */

        if (
          !localStorage.getItem(
            "transactions"
          )
        ) {

          localStorage.setItem(
            "transactions",
            "[]"
          );

        }


        if (
          !localStorage.getItem(
            "ffTransactions"
          )
        ) {

          localStorage.setItem(
            "ffTransactions",
            "[]"
          );

        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        message.textContent =
          "Account created successfully! Member ID: " +
          memberId;

        message.style.color = "green";


        /* =========================
           REDIRECT TO LOGIN
        ========================= */

        setTimeout(function() {

          window.location.href =
            "member-login.html";

        }, 1500);

      });

  </script>

</body>
    </html>
