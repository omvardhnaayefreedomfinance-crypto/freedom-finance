<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Freedom Finance</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .signup-card {
      max-width: 500px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }

    .terms-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .terms-group input {
      width: auto;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .signup-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .signup-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<section class="community">

  <div class="section-number">COMMUNITY</div>

  <h2>Create Your <span>Account</span></h2>

  <p class="community-text">
    Join the Freedom Finance community and create your member account.
  </p>

  <div class="signup-card">

    <form id="signupForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          maxlength="100"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input
          type="tel"
          id="mobile"
          placeholder="Enter your mobile number"
          autocomplete="tel"
          maxlength="20"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create password (minimum 6 characters)"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm password"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <div class="terms-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the Terms &amp; Conditions
        </label>
      </div>

      <button
        type="submit"
        class="signup-btn"
        id="signupButton"
      >
        CREATE ACCOUNT
      </button>

      <div
        id="signupMessage"
        class="signup-message"
        aria-live="polite"
        role="status"
      ></div>

    </form>

    <p class="login-text">
      Already have an account?
      <a href="member-login.html">Member Login</a>
    </p>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </div>
</section>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification,
  updateProfile,
  signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


/* FIREBASE CONFIGURATION */

const firebaseConfig = {
  apiKey: "AIzaSyBcmNDQz0BjeX0d1Zx5LJyUZmGofu_wRHA",
  authDomain: "omvardhnaayefreedomfinan-efaf4.firebaseapp.com",
  projectId: "omvardhnaayefreedomfinan-efaf4",
  storageBucket: "omvardhnaayefreedomfinan-efaf4.firebasestorage.app",
  messagingSenderId: "552483514216",
  appId: "1:552483514216:web:3f6bfa2c10e74a97ba18dd",
  measurementId: "G-6MPELL55BD"
};


/* HTML ELEMENTS */

const signupForm = document.getElementById("signupForm");
const signupButton = document.getElementById("signupButton");
const signupMessage = document.getElementById("signupMessage");


/* MESSAGE FUNCTION */

function showMessage(message, color = "#ff6666") {
  signupMessage.textContent = message;
  signupMessage.style.color = color;
}


/* ERROR HANDLING */

function getErrorDetails(error) {

  const code = error?.code || "unknown";
  const message = error?.message || "Unknown error";

  const friendlyMessages = {

    "auth/email-already-in-use":
      "Is email se account pehle hi bana hua hai. Member Login try karein.",

    "auth/invalid-email":
      "Valid email address enter karein.",

    "auth/weak-password":
      "Password kam se kam 6 characters ka hona chahiye.",

    "auth/network-request-failed":
      "Internet connection mein problem hai.",

    "auth/operation-not-allowed":
      "Firebase Email/Password sign-in method enabled nahi hai.",

    "auth/too-many-requests":
      "Bahut zyada attempts hue hain. Kuch der baad try karein.",

    "auth/invalid-api-key":
      "Firebase API key invalid hai.",

    "auth/api-key-not-valid":
      "Firebase ne API key reject kar di hai.",

    "firestore/permission-denied":
      "Firestore Rules ne member profile save karne ki permission deny kar di.",

    "permission-denied":
      "Firestore Rules ne request deny kar di.",

    "unavailable":
      "Firebase service filhaal unavailable hai."
  };

  return {
    code,
    message,
    friendly: friendlyMessages[code] || message
  };
}


/* FIREBASE INITIALIZATION */

let auth;
let db;
let firebaseReady = false;

try {

  const app = initializeApp(firebaseConfig);

  auth = getAuth(app);
  db = getFirestore(app);

  firebaseReady = true;

} catch (error) {

  console.error("Firebase initialization error:", error);

  showMessage(
    "Firebase initialize nahi hua: " +
    (error?.message || "Unknown error")
  );

}


/* SIGNUP PROCESS */

signupForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (signupButton.disabled) return;

  if (!firebaseReady) {
    showMessage("Firebase initialize nahi hua. Page reload karein.");
    return;
  }

  const name =
    document.getElementById("fullName").value.trim();

  const email =
    document.getElementById("email").value.trim().toLowerCase();

  const mobile =
    document.getElementById("mobile").value.trim();

  const password =
    document.getElementById("password").value;

  const confirmPassword =
    document.getElementById("confirmPassword").value;

  const termsAccepted =
    document.getElementById("terms").checked;


  /* VALIDATION */

  if (!name || !email || !mobile) {
    showMessage("Saari required details fill karein.");
    return;
  }

  if (password.length < 6) {
    showMessage("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Dono passwords match nahi karte.");
    return;
  }

  if (!termsAccepted) {
    showMessage("Please accept Terms & Conditions.");
    return;
  }


  signupButton.disabled = true;

  showMessage(
    "Account create ho raha hai. Please wait...",
    "#d4af37"
  );

  let createdUser = null;
  let profileSaved = false;
  let verificationSent = false;


  try {

    /* STEP 1: CREATE FIREBASE AUTH ACCOUNT */

    const credential = await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    createdUser = credential.user;


    /* STEP 2: SAVE DISPLAY NAME */

    await updateProfile(createdUser, {
      displayName: name
    });


    /* STEP 3: GENERATE MEMBER ID */

    const uid = createdUser.uid;

    const shortUid = uid
      .substring(0, 10)
      .toUpperCase();

    const memberId = "FF" + shortUid;

    const myReferralId = "REF" + shortUid;


    /* STEP 4: REFERRAL INFORMATION */

    const urlParams = new URLSearchParams(
      window.location.search
    );

    const incomingReferral = (
      urlParams.get("ref") || ""
    ).trim().toUpperCase();

    const referredBy = incomingReferral || "Direct";


    /* STEP 5: INITIAL MEMBER DATA */

    const memberData = {

      uid: uid,

      memberId: memberId,

      name: name,

      email: email,

      mobile: mobile,

      myReferralId: myReferralId,

      referredBy: referredBy,

      status: "Pending Verification",

      emailVerified: false,

      investment: 0,

      totalInvestment: 0,

      profit: 0,

      availableBalance: 0,

      totalWithdrawal: 0,

      plan: "",

      planName: "",

      createdAt: serverTimestamp(),

      joinDate: new Date().toISOString()

    };


    /* STEP 6: SAVE PROFILE IN FIRESTORE */

    await setDoc(
      doc(db, "members", uid),
      memberData
    );

    profileSaved = true;


    /* STEP 7: SEND VERIFICATION EMAIL */

    await sendEmailVerification(createdUser);

    verificationSent = true;


    /* STEP 8: SIGN OUT MEMBER */

    await signOut(auth);


    /* STEP 9: SUCCESS MESSAGE */

    signupForm.reset();

    showMessage(
      "Account create ho gaya! Member ID: " +
      memberId +
      ". Verification email bhej di gayi hai. Inbox aur Spam folder check karein. Email verify karne ke baad Member Login karein.",
      "#00cc66"
    );


  } catch (error) {

    console.error(
      "FREEDOM FINANCE SIGNUP ERROR:",
      error
    );

    const details = getErrorDetails(error);


    /* PROFILE SAVE FAILED */

    if (createdUser && !profileSaved) {

      showMessage(
        "Authentication account create ho gaya, lekin Firestore profile save nahi hui. Error: " +
        details.code +
        " | " +
        details.friendly +
        ". Firebase Authentication → Users mein account check karein.",
        "#ff6666"
      );

      if (auth.currentUser) {
        await signOut(auth).catch(err => {
          console.error("Sign out error:", err);
        });
      }

    }

    /* VERIFICATION EMAIL FAILED */

    else if (profileSaved && !verificationSent) {

      showMessage(
        "Account aur member profile save ho gaye hain, lekin verification email send nahi hui. Error: " +
        details.code +
        " | " +
        details.friendly +
        ". Authentication mein account check karein.",
        "#ffcc66"
      );

      if (auth.currentUser) {
        await signOut(auth).catch(err => {
          console.error("Sign out error:", err);
        });
      }

    }

    /* AUTHENTICATION FAILED */

    else {

      showMessage(
        "Signup failed. Error: " +
        details.code +
        " | " +
        details.friendly,
        "#ff6666"
      );

    }

  } finally {

    signupButton.disabled = false;

  }

});

</script>

</body>
</html>
