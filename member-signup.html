<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Freedom Finance</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .signup-card {
      max-width: 500px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }

    .terms-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .terms-group input {
      width: auto;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .signup-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .signup-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <section class="community">

    <div class="section-number">COMMUNITY</div>

    <h2>Create Your <span>Account</span></h2>

    <p class="community-text">
      Join the Freedom Finance community and create your member account.
    </p>

    <div class="signup-card">

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            autocomplete="tel"
            maxlength="20"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create password (minimum 6 characters)"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="terms-group">
          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the Terms &amp; Conditions
          </label>
        </div>

        <button
          type="submit"
          class="signup-btn"
          id="signupButton"
        >
          CREATE ACCOUNT
        </button>

        <div
          id="signupMessage"
          class="signup-message"
          aria-live="polite"
        ></div>

      </form>

      <p class="login-text">
        Already have an account?
        <a href="member-login.html">Member Login</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Home
      </a>

    </div>

  </section>

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      updateProfile,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


    // FIREBASE CONFIGURATION

    const firebaseConfig = {
      apiKey: "AIzaSyD2yn0MetKU7ntbv_JFPy5em3MmgRLBNk",
      authDomain: "omvardhnaayefreedomfinan-efaf4.firebaseapp.com",
      projectId: "omvardhnaayefreedomfinan-efaf4",
      storageBucket: "omvardhnaayefreedomfinan-efaf4.firebasestorage.app",
      messagingSenderId: "552483514216",
      appId: "1:552483514216:web:3f6bfa2c10e74a97ba18dd",
      measurementId: "G-6MPELL55BD"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const signupMessage = document.getElementById("signupMessage");


    function showMessage(text, color) {
      signupMessage.textContent = text;
      signupMessage.style.color = color;
    }


    function getFriendlyError(error) {

      const code = error?.code || "";

      const messages = {
        "auth/email-already-in-use":
          "Is email se account pehle se registered hai. Member Login use karein.",

        "auth/invalid-email":
          "Valid email address enter karein.",

        "auth/weak-password":
          "Password kamzor hai. Kam se kam 6 characters use karein.",

        "auth/network-request-failed":
          "Internet connection check karein aur dobara try karein.",

        "auth/operation-not-allowed":
          "Firebase mein Email/Password sign-in enable karein.",

        "auth/too-many-requests":
          "Bahut attempts hue hain. Thodi der baad try karein.",

        "permission-denied":
          "Database permission error. Firestore Rules aur Firebase project check karna hoga.",

        "auth/unauthorized-continue-uri":
          "Verification email ka continue URL authorized nahi hai.",

        "auth/invalid-continue-uri":
          "Verification email ka continue URL invalid hai.",

        "auth/invalid-action-code":
          "Verification link invalid ya expire ho sakta hai."
      };

      return messages[code] ||
        "Account create karne mein problem hui. Error code: " +
        (code || "unknown");
    }


    signupForm.addEventListener("submit", async function(event) {

      event.preventDefault();

      if (signupButton.disabled) return;

      const name = document
        .getElementById("fullName")
        .value
        .trim();

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const mobile = document
        .getElementById("mobile")
        .value
        .trim();

      const password = document
        .getElementById("password")
        .value;

      const confirmPassword = document
        .getElementById("confirmPassword")
        .value;

      const termsAccepted = document
        .getElementById("terms")
        .checked;


      // FORM VALIDATION

      if (!name || !email || !mobile) {
        showMessage(
          "Saari required details fill karein.",
          "#ff6666"
        );
        return;
      }

      if (password.length < 6) {
        showMessage(
          "Password kam se kam 6 characters ka hona chahiye.",
          "#ff6666"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "Passwords do not match.",
          "#ff6666"
        );
        return;
      }

      if (!termsAccepted) {
        showMessage(
          "Please accept Terms & Conditions.",
          "#ff6666"
        );
        return;
      }


      signupButton.disabled = true;

      showMessage(
        "Account create ho raha hai. Please wait...",
        "#d4af37"
      );


      let createdUser = null;
      let profileSaved = false;
      let verificationSent = false;

      try {

        // 1. CREATE FIREBASE AUTH ACCOUNT

        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        createdUser = credential.user;

        await updateProfile(createdUser, {
          displayName: name
        });


        // 2. GENERATE MEMBER AND REFERRAL IDS

        const uid = createdUser.uid;

        const memberId =
          "FF" + uid.substring(0, 10).toUpperCase();

        const myReferralId =
          "REF" + uid.substring(0, 10).toUpperCase();


        // Referral is recorded for reference only.
        // Referral rewards must be verified server-side.

        const urlParams = new URLSearchParams(
          window.location.search
        );

        const incomingReferral = (
          urlParams.get("ref") || ""
        ).trim().toUpperCase();

        const referredBy = incomingReferral || "Direct";


        // 3. INITIAL MEMBER PROFILE

        const memberData = {

          uid: uid,

          memberId: memberId,

          name: name,

          email: email,

          mobile: mobile,

          myReferralId: myReferralId,

          referredBy: referredBy,

          status: "Pending Verification",

          emailVerified: false,

          investment: 0,

          totalInvestment: 0,

          profit: 0,

          availableBalance: 0,

          totalWithdrawal: 0,

          plan: "",

          planName: "",

          createdAt: serverTimestamp(),

          joinDate: new Date().toISOString()

        };


        // 4. SAVE PROFILE TO FIRESTORE

        await setDoc(
          doc(db, "members", uid),
          memberData
        );

        profileSaved = true;


        // 5. SEND EMAIL VERIFICATION

        await sendEmailVerification(createdUser);

        verificationSent = true;


        // 6. SIGN OUT UNTIL EMAIL IS VERIFIED

        await signOut(auth);


        // 7. SUCCESS MESSAGE

        signupForm.reset();

        showMessage(
          "Account create ho gaya! Aapka Member ID: " +
          memberId +
          ". Verification email check karein. Inbox aur Spam folder dono dekhein. Email verify karne ke baad Member Login karein.",
          "#00cc66"
        );


      } catch (error) {

        console.error("Signup error:", error);

        if (profileSaved && !verificationSent) {

          showMessage(
            "Account aur profile save ho gaye hain, lekin verification email send nahi ho saki. Login page par jaakar verification email resend karne ki koshish karein. " +
            getFriendlyError(error),
            "#ffcc66"
          );

          if (auth.currentUser) {
            try {
              await signOut(auth);
            } catch (signOutError) {
              console.error(signOutError);
            }
          }

        } else if (createdUser && !profileSaved) {

          showMessage(
            "Firebase account create ho gaya, lekin profile save nahi hui. Dobara signup karne se pehle database permission issue solve karna hoga. Error: " +
            getFriendlyError(error),
            "#ff6666"
          );

          try {
            await signOut(auth);
          } catch (signOutError) {
            console.error(signOutError);
          }

        } else {

          showMessage(
            getFriendlyError(error),
            "#ff6666"
          );

        }showMessage(
  "DEBUG CODE: " + (error?.code || "none") +
  " | MESSAGE: " + (error?.message || "none") +
  " | PROJECT: " + firebaseConfig.projectId +
  " | HOST: " + location.hostname,
  "#ff6666"
);

      } finally {

        signupButton.disabled = false;

      }

    });

  </script>

</body>
  </html>
