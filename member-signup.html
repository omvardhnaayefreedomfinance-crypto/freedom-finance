<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freedom Finance - Sign Up</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="community">

    <p class="section-number">COMMUNITY / SIGN UP</p>

    <h2>
      Create Your <span>Account</span>
    </h2>

    <p class="community-text">
      Join the Freedom Finance community and create your personal member account.
    </p>

    <div class="signup-card">

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>

          <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter your mobile number"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            required
          >
        </div>

        <div class="form-check">

          <input
            type="checkbox"
            id="terms"
            required
          >

          <label for="terms">
            I agree to the Freedom Finance terms and community rules.
          </label>

        </div>

        <button type="submit" class="signup-btn">
          CREATE ACCOUNT
        </button>

      </form>

      <p id="signupMessage" class="signup-message"></p>

      <p class="login-text">
        Already have an account?
        <a href="member-login.html">Login</a>
      </p>

    </div>

    <div class="back-home">
      <a href="index.html">← Back to Freedom Finance</a>
    </div>

  </section>

  <script>

document
  .getElementById("signupForm")
  .addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
      document.getElementById("fullName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;

    const message =
      document.getElementById("signupMessage");

    if (password !== confirmPassword) {

      message.textContent =
        "Passwords do not match.";

      return;
    }

    /* SAVE CUSTOMER ACCOUNT */

    const user = {
      name: name,
      email: email,
      password: password
    };

    localStorage.setItem(
      "ffdemo",
      JSON.stringify(user)
    );

    /* EMPTY TRANSACTION HISTORY FOR NEW ACCOUNT */

    if (!localStorage.getItem("ffTransactions")) {
      localStorage.setItem(
        "ffTransactions",
        "[]"
      );
    }

    message.textContent =
      "Account created successfully. You can login now.";

    /* GO TO LOGIN PAGE */

    setTimeout(function() {

      window.location.href =
        "member-login.html";

    }, 1000);

  });

  </script>

</body>
</html>
