<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account - Freedom Finance</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .signup-card {
      max-width: 500px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 15px;
    }

    .terms-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0;
    }

    .terms-group input {
      width: auto;
    }

    .signup-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    .signup-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .signup-message {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      overflow-wrap: anywhere;
      line-height: 1.6;
    }

    .login-text {
      text-align: center;
      margin-top: 20px;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <section class="community">

    <div class="section-number">COMMUNITY</div>

    <h2>Create Your <span>Account</span></h2>

    <p class="community-text">
      Join the Freedom Finance community and create your member account.
    </p>

    <div class="signup-card">

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>
          <input
            type="tel"
            id="mobile"
            placeholder="Enter your mobile number"
            autocomplete="tel"
            maxlength="20"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Create password (minimum 6 characters)"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            minlength="6"
            required
          >
        </div>

        <div class="terms-group">
          <input type="checkbox" id="terms" required>

          <label for="terms">
            I agree to the Terms &amp; Conditions
          </label>
        </div>

        <button
          type="submit"
          class="signup-btn"
          id="signupButton"
        >
          CREATE ACCOUNT
        </button>

        <div
          id="signupMessage"
          class="signup-message"
          aria-live="polite"
          role="status"
        ></div>

      </form>

      <p class="login-text">
        Already have an account?
        <a href="member-login.html">Member Login</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Home
      </a>

    </div>
  </section>

  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      sendEmailVerification,
      updateProfile,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcmNDQz0BjeX0d1Zx5LJyUZmGofu_wRHA",
      authDomain: "omvardhnaayefreedomfinan-efaf4.firebaseapp.com",
      projectId: "omvardhnaayefreedomfinan-efaf4",
      storageBucket: "omvardhnaayefreedomfinan-efaf4.firebasestorage.app",
      messagingSenderId: "552483514216",
      appId: "1:552483514216:web:3f6bfa2c10e74a97ba18dd",
      measurementId: "G-6MPELL55BD"
    };

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const signupMessage = document.getElementById("signupMessage");

    function showMessage(message, color = "#ff6666") {
      signupMessage.textContent = message;
      signupMessage.style.color = color;
    }

    function getErrorDetails(error) {
      const code = error?.code || "unknown";
      const message = error?.message || "No additional details";

      const friendlyMessages = {
        "auth/api-key-not-valid":
          "Firebase ne API key reject kar di hai. Signup code ka syntax theek hai, lekin Firebase configuration ko accept nahi kiya gaya.",

        "auth/invalid-api-key":
          "Firebase API key invalid hai.",

        "auth/email-already-in-use":
          "Is email se Firebase account pehle hi bana hua hai. Member Login try karein.",

        "auth/invalid-email":
          "Valid email address enter karein.",

        "auth/weak-password":
          "Password kam se kam 6 characters ka hona chahiye.",

        "auth/network-request-failed":
          "Internet connection ya network request mein problem hai.",

        "auth/operation-not-allowed":
          "Firebase Email/Password sign-in method enabled nahi hai.",

        "auth/too-many-requests":
          "Bahut zyada attempts hue hain. Kuch der baad try karein.",

        "auth/unauthorized-continue-uri":
          "Verification email ka continue URL authorized nahi hai.",

        "auth/invalid-continue-uri":
          "Verification email ka continue URL invalid hai.",

        "permission-denied":
          "Firestore ne profile save karne ki permission deny ki hai.",

        "unavailable":
          "Firebase service filhaal unavailable hai. Thodi der baad try karein."
      };

      return {
        code,
        message,
        friendly: friendlyMessages[code] || message
      };
    }

    let firebaseReady = false;
    let auth;
    let db;

    try {
      const app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      firebaseReady = true;
    } catch (error) {
      console.error("Firebase initialization error:", error);

      showMessage(
        "Firebase initialize nahi hua. Error: " +
        (error?.code || error?.message || "unknown"),
        "#ff6666"
      );
    }

    signupForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (signupButton.disabled) return;

      if (!firebaseReady) {
        showMessage(
          "Firebase initialize nahi hua. Page reload karke dobara try karein.",
          "#ff6666"
        );
        return;
      }

      const name = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const mobile = document.getElementById("mobile").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const termsAccepted = document.getElementById("terms").checked;

      if (!name || !email || !mobile) {
        showMessage("Saari required details fill karein.");
        return;
      }

      if (password.length < 6) {
        showMessage("Password kam se kam 6 characters ka hona chahiye.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Dono passwords match nahi karte.");
        return;
      }

      if (!termsAccepted) {
        showMessage("Please accept Terms & Conditions.");
        return;
      }

      signupButton.disabled = true;

      showMessage("Account create ho raha hai. Please wait...", "#d4af37");

      let createdUser = null;
      let profileSaved = false;
      let verificationSent = false;

      try {
        // Step 1: Create Authentication account.
        const credential = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        createdUser = credential.user;

        // Step 2: Save display name.
        await updateProfile(createdUser, {
          displayName: name
        });

        const uid = createdUser.uid;
        const shortUid = uid.substring(0, 10).toUpperCase();

        const memberId = "FF" + shortUid;
        const myReferralId = "REF" + shortUid;

        const urlParams = new URLSearchParams(window.location.search);
        const incomingReferral = (urlParams.get("ref") || "")
          .trim()
          .toUpperCase();

        const referredBy = incomingReferral || "Direct";

        // Step 3: Save initial member profile.
        const memberData = {
          uid: uid,
          memberId: memberId,
          name: name,
          email: email,
          mobile: mobile,
          myReferralId: myReferralId,
          referredBy: referredBy,
          status: "Pending Verification",
          emailVerified: false,
          investment: 0,
          totalInvestment: 0,
          profit: 0,
          availableBalance: 0,
          totalWithdrawal: 0,
          plan: "",
          planName: "",
          createdAt: serverTimestamp(),
          joinDate: new Date().toISOString()
        };

        await setDoc(doc(db, "members", uid), memberData);
        profileSaved = true;

        // Step 4: Send verification email.
        try {
          await sendEmailVerification(createdUser);
          verificationSent = true;
        } catch (emailError) {
          console.error("Verification email error:", emailError);

          const emailProblem = getErrorDetails(emailError);

          await signOut(auth).catch(() => {});

          showMessage(
            "Firebase account aur member profile create ho gaye hain, lekin verification email nahi bheji ja saki. Error: " +
            emailProblem.code + " | " + emailProblem.message +
            ". Firebase Authentication mein account check karein.",
            "#ffcc66"
          );
          return;
        }

        // Step 5: Sign out until the member chooses to log in.
        await signOut(auth);

        signupForm.reset();

        showMessage(
          "Account create ho gaya! Member ID: " + memberId +
          ". Verification email bhej di gayi hai. Inbox aur Spam folder check karein. Email verify hone ke baad Member Login karein.",
          "#00cc66"
        );

      } catch (error) {
        console.error("FREEDOM FINANCE SIGNUP ERROR:", error);

        const details = getErrorDetails(error);

        if (createdUser && !profileSaved) {
          showMessage(
            "Firebase Authentication account create ho gaya, lekin member profile save nahi hui. Error: " +
            details.code + " | " + details.message +
            ". Account ko Authentication → Users mein check karein.",
            "#ff6666"
          );

          if (auth.currentUser) {
            await signOut(auth).catch(signOutError => {
              console.error("Sign-out error:", signOutError);
            });
          }

        } else if (profileSaved && !verificationSent) {
          showMessage(
            "Member profile save ho gayi, lekin verification email nahi bheji gayi. Error: " +
            details.code + " | " + details.message,
            "#ffcc66"
          );

        } else {
          showMessage(
            "Signup failed. Error: " + details.code +
            " | " + details.message +
            " | Project: " + firebaseConfig.projectId,
            "#ff6666"
          );
        }

      } finally {
        signupButton.disabled = false;
      }
    });
  </script>
</body>
  </html>
