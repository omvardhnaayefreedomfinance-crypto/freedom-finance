<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freedom Finance - Customer History</title><style>*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff8e7;font:15px Arial,sans-serif}header{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#090909;border-bottom:1px solid #6d5318}.logo{color:#ffd96a;font-weight:800}.back{color:#ffd96a;text-decoration:none}.wrap{max-width:950px;margin:auto;padding:22px 14px}.title{color:#ffd96a;margin-bottom:4px}.muted{color:#999}.card{background:linear-gradient(145deg,#18130a,#090909);border:1px solid #735719;border-radius:16px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:#080808;border:1px solid #433716;border-radius:10px;padding:10px}.label{font-size:11px;color:#888}.value{margin-top:5px;font-weight:700;word-break:break-word}.gold{color:#ffd96a}.green{color:#72e6a1}.button{display:inline-block;margin-top:12px;padding:11px 15px;border:1px solid #8b691d;border-radius:10px;background:linear-gradient(135deg,#d99b16,#ffd96a);color:#171107;font-weight:800}.history{margin-top:30px}.empty{padding:18px;border:1px dashed #604b18;border-radius:12px;color:#999}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">FREEDOM FINANCE</div><a class="back" href="member-dashboard.html">← DASHBOARD</a></header><main class="wrap"><h1 class="title">CUSTOMER TRANSACTION HISTORY</h1><p class="muted">Your investment, payment and withdrawal records.</p><section id="transactions"></section><section class="history"><h2 class="title">WITHDRAWAL HISTORY</h2><div id="withdrawals"></div></section></main><script src="ff-transaction.js"></script><script>
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]))}
function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}
const u=ffGetUser()||{};const email=u.email||"";const txs=ffGetTransactions().filter(x=>!email||x.customerEmail===email);const tbox=document.getElementById("transactions");
if(!txs.length)tbox.innerHTML='<div class="empty">No transaction record found yet.</div>';
txs.forEach(x=>{const ready=ffCanWithdraw(x.maturityDate);const status=x.withdrawalStatus||"Not Requested";tbox.insertAdjacentHTML("beforeend",`<div class="card"><div class="grid"><div class="item"><div class="label">TRANSACTION ID</div><div class="value gold">${esc(x.id)}</div></div><div class="item"><div class="label">CUSTOMER EMAIL</div><div class="value">${esc(x.customerEmail)}</div></div><div class="item"><div class="label">PLAN</div><div class="value">${esc(x.plan)}</div></div><div class="item"><div class="label">INVESTMENT</div><div class="value">${money(x.amount)}</div></div><div class="item"><div class="label">PROFIT</div><div class="value">${money(x.profit)}</div></div><div class="item"><div class="label">TOTAL</div><div class="value gold">${money(x.total)}</div></div><div class="item"><div class="label">UTR / REFERENCE</div><div class="value">${esc(x.reference||"—")}</div></div><div class="item"><div class="label">PAYMENT STATUS</div><div class="value">${esc(x.paymentStatus||"Pending")}</div></div><div class="item"><div class="label">START DATE</div><div class="value">${esc(x.startDate)}</div></div><div class="item"><div class="label">MATURITY DATE</div><div class="value">${esc(x.maturityDate)}</div></div></div><p class="gold">Withdrawal Status: ${esc(status)}</p>${status!=="Requested"?`<button class="button" onclick="withdraw('${esc(x.id)}')">REQUEST WITHDRAWAL</button>`:'<div class="green">✓ Withdrawal request already recorded.</div>'}${!ready&&status!=="Requested"?'<div class="muted" style="margin-top:8px">Request button is visible; withdrawal becomes available on the maturity date.</div>':''}</div>`)});
function withdraw(id){const r=ffRequestWithdrawal(id);alert(r.message);if(r.ok)location.reload()}
const ws=ffGetWithdrawals().filter(x=>!email||x.customerEmail===email),wbox=document.getElementById("withdrawals");if(!ws.length)wbox.innerHTML='<div class="empty">No withdrawal request recorded yet.</div>';ws.forEach(w=>wbox.insertAdjacentHTML("beforeend",`<div class="card"><div class="grid"><div class="item"><div class="label">WITHDRAWAL ID</div><div class="value gold">${esc(w.id)}</div></div><div class="item"><div class="label">TRANSACTION ID</div><div class="value">${esc(w.transactionId)}</div></div><div class="item"><div class="label">CUSTOMER EMAIL</div><div class="value">${esc(w.customerEmail)}</div></div><div class="item"><div class="label">AMOUNT</div><div class="value gold">${money(w.amount)}</div></div><div class="item"><div class="label">STATUS</div><div class="value">${esc(w.status)}</div></div><div class="item"><div class="label">REQUESTED</div><div class="value">${new Date(w.requestedAt).toLocaleString("en-IN")}</div></div></div></div>`));
</script></body></html>
