<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transaction History - Freedom Finance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #080808;
      color: #fff;
      min-height: 100vh;
    }

    .header {
      background: #111;
      border-bottom: 1px solid #333;
      padding: 18px 15px;
      text-align: center;
    }

    .header h1 {
      color: #f5b400;
      font-size: 24px;
    }

    .header p {
      color: #aaa;
      margin-top: 5px;
      font-size: 13px;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .back {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: #222;
      border: 1px solid #444;
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .back:hover {
      background: #333;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .card h3 {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card .value {
      color: #f5b400;
      font-size: 24px;
      font-weight: bold;
    }

    .history {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
      overflow-x: auto;
    }

    .history h2 {
      color: #f5b400;
      margin-bottom: 18px;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      padding: 13px 10px;
      border-bottom: 1px solid #2b2b2b;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: #f5b400;
      background: #181818;
    }

    td {
      color: #ddd;
    }

    .deposit {
      color: #32d583;
      font-weight: bold;
    }

    .withdrawal {
      color: #ff6b6b;
      font-weight: bold;
    }

    .pending {
      color: #f5b400;
    }

    .completed {
      color: #32d583;
    }

    .failed {
      color: #ff6b6b;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #888;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .container {
        width: 92%;
      }

      .card .value {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>FREEDOM FINANCE</h1>
    <p>Transaction History</p>
  </div>

  <div class="container">

    <a href="member-dashboard.html" class="back">
      ← Back to Dashboard
    </a>

    <div class="stats">

      <div class="card">
        <h3>Total Deposit</h3>
        <div class="value" id="totalDeposit">₹0</div>
      </div>

      <div class="card">
        <h3>Total Withdrawal</h3>
        <div class="value" id="totalWithdrawal">₹0</div>
      </div>

      <div class="card">
        <h3>Total Transactions</h3>
        <div class="value" id="totalTransactions">0</div>
      </div>

    </div>

    <div class="history">

      <h2>Transaction History</h2>

      <table>

        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Reference</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="transactionBody"></tbody>

      </table>

      <div id="emptyMessage" class="empty">
        No transactions found.
      </div>

    </div>

  </div>

  <script>

    const transactions =
      JSON.parse(localStorage.getItem("transactions") || "[]");

    let totalDeposit = 0;
    let totalWithdrawal = 0;

    const tbody = document.getElementById("transactionBody");
    const emptyMessage = document.getElementById("emptyMessage");

    if (transactions.length === 0) {

      emptyMessage.style.display = "block";

    } else {

      emptyMessage.style.display = "none";

      transactions.forEach(function (transaction) {

        const type = String(transaction.type || "").toLowerCase();

        const amount = Number(transaction.amount || 0);

        if (
          type === "deposit" ||
          type === "investment"
        ) {
          totalDeposit += amount;
        }

        if (
          type === "withdrawal" ||
          type === "withdraw"
        ) {
          totalWithdrawal += amount;
        }

        const row = document.createElement("tr");

        const date =
          transaction.date ||
          transaction.createdAt ||
          new Date().toLocaleString();

        const displayType =
          transaction.type || "Transaction";

        const reference =
          transaction.reference ||
          transaction.ref ||
          "—";

        const status =
          transaction.status ||
          "Pending";

        let typeClass = "";

        if (
          type === "deposit" ||
          type === "investment"
        ) {
          typeClass = "deposit";
        }

        if (
          type === "withdrawal" ||
          type === "withdraw"
        ) {
          typeClass = "withdrawal";
        }

        let statusClass =
          String(status).toLowerCase();

        row.innerHTML = `
          <td>${date}</td>
          <td class="${typeClass}">
            ${displayType}
          </td>
          <td>₹${amount.toLocaleString("en-IN")}</td>
          <td>${reference}</td>
          <td class="${statusClass}">
            ${status}
          </td>
        `;

        tbody.appendChild(row);

      });

    }

    document.getElementById("totalDeposit").textContent =
      "₹" + totalDeposit.toLocaleString("en-IN");

    document.getElementById("totalWithdrawal").textContent =
      "₹" + totalWithdrawal.toLocaleString("en-IN");

    document.getElementById("totalTransactions").textContent =
      transactions.length;

  </script>

</body>
  </html>
