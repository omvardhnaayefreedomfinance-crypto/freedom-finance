<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freedom Finance - Plan Summary</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #050505;
  color: #fff8e7;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 600px;
  margin: 35px auto;
}

.card {
  padding: 25px;
  border: 1px solid #735719;
  border-radius: 18px;
  background: linear-gradient(145deg, #17130b, #090909);
}

h1 {
  color: #ffd96a;
  text-align: center;
}

.subtitle {
  text-align: center;
  color: #aaa;
  line-height: 1.6;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 0;
  border-bottom: 1px solid #443718;
}

.row span:first-child {
  color: #aaa;
}

.row strong {
  text-align: right;
  overflow-wrap: anywhere;
}

.total {
  color: #ffd96a;
  font-size: 20px;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #d99b16, #ffd96a);
  color: #171107;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.back {
  display: block;
  margin-top: 20px;
  text-align: center;
  color: #ffd96a;
  text-decoration: none;
}

.message {
  color: #ffd96a;
  text-align: center;
  line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>PLAN SUMMARY</h1>

    <p class="subtitle">
      Review your selected plan before proceeding.
    </p>

    <div class="row">
      <span>Selected Plan</span>
      <strong id="planName">—</strong>
    </div>

    <div class="row">
      <span>Investment Amount</span>
      <strong id="planAmount">—</strong>
    </div>

    <div class="row">
      <span>Displayed Profit Estimate</span>
      <strong id="planProfit">—</strong>
    </div>

    <div class="row">
      <span>Displayed Total Estimate</span>
      <strong class="total" id="planTotal">—</strong>
    </div>

    <p class="subtitle">
      Estimates are not guaranteed returns. Review the applicable
      terms and risks before making any payment.
    </p>

    <p class="message" id="message"></p>

    <button id="continueBtn" type="button">
      CONTINUE TO PAYMENT
    </button>

    <a class="back" href="plans.html">← Back to Plans</a>
  </div>
</div>

<script>
const plan = localStorage.getItem("selectedPlan");
const amount = localStorage.getItem("selectedAmount");
const profit = localStorage.getItem("selectedProfit");
const total = localStorage.getItem("selectedTotal");

const message = document.getElementById("message");
const continueBtn = document.getElementById("continueBtn");

if (plan && amount && profit && total) {
  document.getElementById("planName").textContent = plan;
  document.getElementById("planAmount").textContent = amount;
  document.getElementById("planProfit").textContent = profit;
  document.getElementById("planTotal").textContent = total;
} else {
  message.textContent =
    "Please go back to Plans and select a plan first.";
  continueBtn.disabled = true;
  continueBtn.style.opacity = "0.5";
}

continueBtn.addEventListener("click", function () {
  if (!plan || !amount || !profit || !total) {
    return;
  }

  window.location.href = "payment.html";
});
</script>

</body>
  </html>
