<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freedom Finance - Member Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="community">

    <p class="section-number">COMMUNITY / LOGIN</p>

    <h2>
      Member <span>Login</span>
    </h2>

    <p class="community-text">
      Login to access your Freedom Finance member dashboard,
      project updates and plan information.
    </p>

    <div class="signup-card">

      <form id="loginForm">

        <div class="form-group">

          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>

        <div class="form-group">

          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

        </div>

        <button type="submit" class="signup-btn">
          MEMBER LOGIN
        </button>

      </form>

      <p
        id="loginMessage"
        class="signup-message"
        aria-live="polite"
      ></p>

      <p class="login-text">
        Don't have an account?
        <a href="member-signup.html">Create Account</a>
      </p>

    </div>

    <div class="back-home">
      <a href="index.html">← Back to Freedom Finance</a>
    </div>

  </section>

  <script>
  (function () {

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");
    const loginButton = loginForm.querySelector('button[type="submit"]');

    loginForm.addEventListener("submit", function (event) {

      event.preventDefault();

      const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

      const password = document.getElementById("password").value;

      message.textContent = "";
      message.style.color = "";

      let members;

      // Read registered members from this browser
      try {

        members = JSON.parse(
          localStorage.getItem("members") || "[]"
        );

        if (!Array.isArray(members)) {
          members = [];
        }

      } catch (error) {

        message.textContent =
          "Member data read nahi ho raha. Please try again.";

        message.style.color = "red";
        return;

      }

      // Find the registered member
      const member = members.find(function (item) {

        return (
          item &&
          typeof item.email === "string" &&
          item.email.trim().toLowerCase() === email &&
          typeof item.password === "string" &&
          item.password === password
        );

      });

      // Stop if email or password is incorrect
      if (!member) {

        message.textContent =
          "Email ya password galat hai. Apni registration details check karein.";

        message.style.color = "red";
        return;

      }

      // Save the current member session
      try {

        localStorage.setItem(
          "currentMember",
          JSON.stringify(member)
        );

        localStorage.setItem(
          "memberEmail",
          member.email
        );

        localStorage.setItem(
          "memberLoggedIn",
          "true"
        );

      } catch (error) {

        localStorage.removeItem("memberLoggedIn");

        message.textContent =
          "Login session save nahi ho saka. Browser storage check karein.";

        message.style.color = "red";
        return;

      }

      // Login successful
      message.textContent =
        "Login successful! Dashboard khul raha hai...";

      message.style.color = "green";

      loginButton.disabled = true;

      // Open the correct dashboard file
      setTimeout(function () {

      window.location.href = "https://omvardhnaayefreedomfinance-crypto.github.io/freedom-finance/member-dashboard.html";

      }, 700);

    });

  })();
  </script>

</body>

</html>
