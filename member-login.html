<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Freedom Finance - Member Login</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="community">

    <p class="section-number">COMMUNITY / LOGIN</p>

    <h2>
      Member <span>Login</span>
    </h2>

    <p class="community-text">
      Login to access your Freedom Finance member dashboard,
      project updates and plan information.
    </p>

    <div class="signup-card">

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <button type="submit" class="signup-btn">
          MEMBER LOGIN
        </button>

      </form>

      <p id="loginMessage" class="signup-message"></p>

      <p class="login-text">
        Don't have an account?
        <a href="member-signup.html">Create Account</a>
      </p>

    </div>

    <div class="back-home">
      <a href="index.html">← Back to Freedom Finance</a>
    </div>

  </section>

  <script>
document.getElementById("loginForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim().toLowerCase();
  const password = document.getElementById("password").value;
  const message = document.getElementById("loginMessage");

  let members = [];

  try {
    members = JSON.parse(localStorage.getItem("members") || "[]");
  } catch (error) {
    members = [];
  }

  const member = members.find(function(item) {
    return item.email &&
      item.email.toLowerCase() === email &&
      item.password === password;
  });

  if (!member) {
    message.textContent = "Invalid email or password. Please check your details.";
    message.style.color = "red";
    return;
  }

  localStorage.setItem("currentMember", JSON.stringify(member));
  localStorage.setItem("memberEmail", member.email);
  localStorage.setItem("memberLoggedIn", "true");

  message.textContent = "Login successful. Opening dashboard...";
  message.style.color = "green";

  setTimeout(function() {
    window.location.href = "./dashboard.html";
  }, 800);
});
      </script>

</body>
</html>
